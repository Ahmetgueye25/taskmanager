
name: CI de taskmanager

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  task:
    runs-on: ubuntu-latest

    steps:
      # Récupération du code
      - name: récupérer le code
        uses: actions/checkout@v4

      # Installation de Python avec cache pip
      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # Installation des dépendances
      - name: installer les dépendances
        run: pip install -r requirements.txt

      # Exécution des tests
      - name: exécuter les tests avec pytest
        run: pytest

      # Configuration de Docker Buildx
      - name: configurer Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # Connexion à GHCR
      - name: connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génération des tags
      - name: générer les tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      # Construction et publication de l'image
      - name: construire et publier l'image Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

