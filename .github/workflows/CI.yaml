
name: CI de taskmanager

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  task:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: récupérer le code
        uses: actions/checkout@v4

      # 2. Installation de Python et configuration du cache
      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 3. Installation des dépendances
      - name: installer les dépendances
        run: pip install -r requirements.txt

      # 4. Exécution des tests
      - name: exécuter les tests avec pytest
        run: python -m pytest

      # 5. Configuration QEMU pour le multiarchitecture
      - name: configurer QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      # 6. Configuration Docker Buildx
      - name: configurer Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 7. Connexion à GHCR
      - name: connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Génération des tags
      - name: générer les tags
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      # 9. Construction et publication multiarchitecture
      - name: construire et publier l'image Docker
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

